<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کارت دعوت</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fff1f2; overflow: hidden; font-family: sans-serif; }

        /* افکت گلبرگ‌ها */
        .petals { position: absolute; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .petal { position: absolute; background: #fda4af; border-radius: 0 50% 0 50%; opacity: 0.6; animation: fall 8s linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10vh); } 100% { transform: translateY(110vh); } }

        /* پاکت */
        .envelope { width: 280px; height: 180px; background: #fecdd3; position: relative; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 2; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .heart { font-size: 30px; animation: shine 1.5s infinite alternate; }
        @keyframes shine { from { filter: brightness(1); } to { filter: brightness(1.3); } }

        /* کارت */
        .card { width: 240px; height: 160px; background: white; position: absolute; bottom: 10px; transition: 0.6s ease-out; z-index: 1; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .card img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: 0.8s; }
    </style>
</head>
<body>

<div class="petals" id="petals"></div>
<div class="envelope" id="envelope">
    <div class="heart">💖</div>
    <div class="card" id="card">
        <img src="IMG_4152.jpeg" id="card-img">
    </div>
</div>

<script>
    // تولید گلبرگ‌ها
    const petalsContainer = document.getElementById('petals');
    for(let i=0; i<15; i++) {
        let p = document.createElement('div');
        p.className = 'petal';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 8 + 's';
        p.style.width = p.style.height = (Math.random() * 15 + 10) + 'px';
        petalsContainer.appendChild(p);
    }

    let clickCount = 0;
    document.getElementById('envelope').addEventListener('click', () => {
        clickCount++;
        const card = document.getElementById('card');
        const img = document.getElementById('card-img');
        
        if(clickCount === 1) {
            card.style.bottom = '120px'; // کارت تاخورده بیرون می‌آید
        } else if(clickCount === 2) {
            card.style.bottom = '50%';
            card.style.transform = 'translateY(50%)';
            card.style.height = '450px'; // کارت باز می‌شود
            card.style.width = '320px';
            img.style.opacity = '1';
        }
    });
</script>
</body>
</html>
