<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Invitation</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#ffd6e5,#fff2a8);
font-family:tahoma;
}


/* گلبرگ ها */

.petal{
position:absolute;
top:-30px;
font-size:25px;
animation:fall 8s linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(360deg);
}
}


/* پاکت */

.envelope{
width:360px;
height:230px;
background:#f5aec6;
border-radius:18px;
position:relative;
cursor:pointer;
box-shadow:0 15px 35px rgba(150,80,100,.35);
}


/* در پاکت */

.flap{
position:absolute;
top:0;
left:0;
width:0;
height:0;
border-left:180px solid transparent;
border-right:180px solid transparent;
border-top:120px solid #ed91af;
transform-origin:top;
transition:1s;
z-index:5;
}


/* مهر */

.seal{
position:absolute;
width:55px;
height:55px;
background:#e8789c;
border-radius:50%;
left:50%;
top:95px;
transform:translateX(-50%);
z-index:6;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}


/* کارت */

.card{
position:absolute;
width:280px;
height:410px;
background:#fff8c7;
left:40px;
top:20px;
border-radius:15px;
overflow:hidden;
z-index:0;
transition:1.5s;
transform:translateY(0);
}


/* عکس کارت */

.card img{
width:100%;
height:100%;
object-fit:contain;
border-radius:15px;
}


/* باز شدن */

.envelope.open .flap{
transform:rotateX(180deg);
}


.envelope.open .seal{
opacity:0;
transition:.5s;
}


.envelope.open .card{
transform:translateY(-220px);
z-index:4;
}

</style>
</head>

<body>

<div class="petal" style="left:10%">🌺</div>
<div class="petal" style="left:30%;animation-delay:2s">🌸</div>
<div class="petal" style="left:55%;animation-delay:4s">🍃</div>
<div class="petal" style="left:80%;animation-delay:1s">🌺</div>


<div class="envelope" onclick="openCard()">

    <div class="flap"></div>

    <div class="seal">
        💖
    </div>

<div class="card">
    <img src="IMG_4152.jpeg">
</div>

<div class="shine"></div>


<script>

function openCard(){
    document.querySelector(".envelope")
    .classList.toggle("open");
}

</script>


</body>
</html>
