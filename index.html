<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت دعوت</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fff1f2; overflow: hidden; }

        /* گلبرگ‌ها */
        .petals { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .petal { position: absolute; border-radius: 0 50% 0 50%; opacity: 0.6; animation: fall 8s linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); } 100% { transform: translateY(110vh) rotate(360deg); } }

        .container { position: relative; width: 300px; height: 200px; z-index: 10; }

        /* پاکت */
        .envelope { width: 300px; height: 200px; background: #fecdd3; position: relative; border-radius: 0 0 10px 10px; z-index: 2; cursor: pointer; }
        /* درب پاکت */
        .envelope-flap { position: absolute; top: 0; width: 300px; height: 100px; background: #fda4af; clip-path: polygon(0 0, 100% 0, 50% 100%); transition: 0.5s; transform-origin: top; z-index: 3; }
        .heart { position: absolute; top: 50px; left: 130px; font-size: 30px; z-index: 4; pointer-events: none; }

        /* کارت */
        .card { width: 260px; height: 180px; background: white; position: absolute; bottom: 10px; left: 20px; transition: 0.8s; z-index: 1; border: 2px solid #fda4af; }
        .card img { width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: 0.5s; }

        /* حالت‌های کلیک */
        .open-flap { transform: rotateX(180deg); }
        .card.move-out { bottom: 120px; }
        .card.go-center { bottom: 50vh; transform: translateY(50%) scale(1.5); z-index: 5; }
    </style>
</head>
<body>

<div class="petals" id="petals"></div>
<div class="container" id="container">
    <div class="envelope-flap" id="flap"></div>
    <div class="envelope" id="env">
        <div class="heart">💖</div>
    </div>
    <div class="card" id="card"><img src="IMG_4152.jpeg" id="photo"></div>
</div>

<script>
    // گلبرگ‌های رنگی
    const colors = ['#fda4af', '#fbbf24', '#fef08a']; // صورتی، نارنجی، لیمویی
    const pContainer = document.getElementById('petals');
    for(let i=0; i<25; i++) {
        let p = document.createElement('div');
        p.className = 'petal';
        p.style.left = Math.random() * 100 + '%';
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        p.style.animationDelay = Math.random() * 8 + 's';
        p.style.width = p.style.height = (Math.random() * 15 + 10) + 'px';
        pContainer.appendChild(p);
    }

    let step = 0;
    document.getElementById('container').addEventListener('click', () => {
        step++;
        if(step === 1) {
            document.getElementById('flap').classList.add('open-flap');
            document.getElementById('card').classList.add('move-out');
        } else if(step === 2) {
            const card = document.getElementById('card');
            card.classList.add('go-center');
            document.getElementById('photo').style.opacity = '1';
        }
    });
</script>
</body>
</html>
