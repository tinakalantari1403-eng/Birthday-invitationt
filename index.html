<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Invitation</title>

<style>
body{
margin:0;
height:100vh;
background:linear-gradient(#ffd5e1,#fff1a8);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:tahoma;
}

.petal{
position:absolute;
top:-20px;
font-size:25px;
animation:fall 8s linear infinite;
}

@keyframes fall{
from{transform:translateY(-50px) rotate(0)}
to{transform:translateY(100vh) rotate(360deg)}
}

.envelope{
width:320px;
height:220px;
background:#f6b3c7;
border-radius:15px;
position:relative;
cursor:pointer;
box-shadow:0 15px 35px #c58a9b;
}

.flap{
position:absolute;
width:0;
height:0;
border-left:160px solid transparent;
border-right:160px solid transparent;
border-top:120px solid #ee91ad;
top:0;
transform-origin:top;
transition:1s;
}

.card{
position:absolute;
width:300px;
height:auto;
min-height:420px;
background:#fff7bd;
left:10px;
top:-100px;
border-radius:15px;
transition:1.2s;
z-index:-1;
overflow:hidden;
}

.card img{
width:100%;
height:auto;
display:block;
object-fit:contain;
border-radius:15px;
}

.envelope.open .flap{
transform:rotateX(180deg);
}

.envelope.open .card{
transform:translateY(-180px);
z-index:2;
}

.shine{
position:absolute;
width:70px;
height:220px;
background:white;
opacity:.4;
transform:rotate(30deg);
animation:shine 3s infinite;
}

@keyframes shine{
from{left:-100px}
to{left:350px}
}

</style>
</head>

<body>

<div class="petal" style="left:10%">🌺</div>
<div class="petal" style="left:30%;animation-delay:2s">🌸</div>
<div class="petal" style="left:70%;animation-delay:4s">🍃</div>

<div class="envelope" onclick="openEnvelope()">

<div class="flap"></div>

<div class="card">
<img src="IMG_4152.jpeg">
</div>

<div class="shine"></div>

</div>


<script>
function openEnvelope(){
document.querySelector(".envelope").classList.toggle("open");
}
</script>

</body>
</html>
